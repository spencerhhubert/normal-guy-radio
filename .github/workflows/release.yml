name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm test && npm run build
      - run: cd server && go test ./...
      - run: mkdir -p dist && cd server && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/radiod-linux-amd64 .
      - run: tar -C web/build -czf dist/web.tar.gz . && cd dist && sha256sum radiod-linux-amd64 web.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
