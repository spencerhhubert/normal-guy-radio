<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normal Guy Radio</title>
<style>
  :root { --bg: #14110f; --ink: #f3ead8; --dim: #9a8f7e; --accent: #f5a623; --card: #1e1a16; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 32px 20px; }
  h1 { font-size: 30px; letter-spacing: 0.02em; margin: 0; font-weight: 800; }
  .tag { color: var(--dim); margin: 6px 0 28px; text-align: center; font-style: italic; }
  .deck { background: var(--card); border-radius: 18px; padding: 26px; width: min(560px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .row { display: flex; align-items: center; gap: 16px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 10px 18px; background: #2b2520; color: var(--ink); }
  button:hover { background: #3a3129; }
  button:disabled { opacity: .4; cursor: default; }
  #play { width: 86px; height: 86px; border-radius: 50%; background: var(--accent); color: #221a0c; font-size: 30px; font-weight: 800; flex: 0 0 auto; }
  #play:hover { background: #ffb63a; }
  .now { flex: 1; min-width: 0; }
  .now .title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .sub { color: var(--dim); font-size: 13px; margin-top: 3px; }
  .now .chord { font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 70px; display: block; margin: 20px 0 14px; border-radius: 8px; background: #17130f; }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .controls label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--accent); width: 130px; }
  #progress { height: 4px; background: #2b2520; border-radius: 2px; overflow: hidden; margin-top: 16px; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #status { color: var(--dim); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .log { margin-top: 18px; color: var(--dim); font-size: 12.5px; max-height: 120px; overflow: auto; }
  .log div { padding: 2px 0; border-top: 1px solid #2a241f; }
  .layers { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .layers span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #2b2520; color: var(--dim); }
  .layers span.on { background: #4a3a1c; color: var(--accent); }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; user-select: none; }
  summary:hover { color: var(--ink); }
  .mixer { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 18px; margin-top: 12px; }
  .stem { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .stem label { flex: 0 0 82px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stem input[type=range] { flex: 1; width: auto; min-width: 60px; }
  .stem button { padding: 2px 8px; font-size: 11px; flex: 0 0 auto; }
  .stem button.muted { background: #6b2a1c; color: #ffd0c4; }
  .stem.off label { text-decoration: line-through; }
  .mixfoot { margin-top: 10px; display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <h1>Normal Guy Radio</h1>
  <div class="tag">a completely normal guy's life is about to get way more complicated. forever.</div>
  <div class="deck">
    <div class="row">
      <button id="play" disabled title="play / pause">&#9654;</button>
      <div class="now">
        <div class="title" id="title">loading the orchestra…</div>
        <div class="sub" id="sub">&nbsp;</div>
        <div class="sub chord" id="chord">&nbsp;</div>
      </div>
      <button id="skip" disabled title="next cue">skip</button>
    </div>
    <canvas id="viz" width="1024" height="140"></canvas>
    <div class="controls">
      <label>volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <label>seed <input id="seed" type="number" style="width:90px;font:inherit;background:#2b2520;color:var(--ink);border:0;border-radius:6px;padding:4px 8px"></label>
      <button id="reseed">new seed</button>
    </div>
    <div class="layers" id="layers"></div>
    <details id="mixerBox"><summary>mixer</summary>
      <div class="mixer" id="mixer"></div>
      <div class="mixfoot"><button id="mixreset">reset</button><span>faders are remembered on this browser</span></div>
    </details>
    <div id="progress"><i></i></div>
    <div id="status"></div>
    <div class="log" id="log"></div>
  </div>

  <script src="samples/electric_bass_finger.js"></script>
  <script src="samples/electric_guitar_muted.js"></script>
  <script src="samples/electric_piano_1.js"></script>
  <script src="samples/rock_organ.js"></script>
  <script src="samples/whistle.js"></script>
  <script src="samples/french_horn.js"></script>
  <script src="samples/string_ensemble_1.js"></script>
  <script src="samples/pizzicato_strings.js"></script>
  <script src="samples/orchestral_harp.js"></script>
  <script src="samples/choir_aahs.js"></script>
  <script src="samples/clarinet.js"></script>
  <script src="samples/bassoon.js"></script>
  <script src="samples/tuba.js"></script>
  <script src="samples/glockenspiel.js"></script>
  <script src="samples/muted_trumpet.js"></script>
  <script src="composer.js"></script>
  <script src="engine.js"></script>
  <script>
  (async function () {
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const LAYER_NAMES = ['shaker', 'triangle', 'bass', 'drums', 'guitar', 'comp', 'organStab', 'strings', 'horns', 'choir', 'tuba', 'bassoon', 'pizz', 'harp'];
    $('layers').innerHTML = LAYER_NAMES.map(n => `<span data-l="${n}">${n}</span>`).join('');

    // ---- render mode: ?render=SECONDS&seed=N posts a wav to the local harness (tools/harness.py). Never plays anything. ----
    if (params.has('render')) {
      const secs = parseFloat(params.get('render')) || 60, seed = parseInt(params.get('seed') || '1', 10);
      $('title').textContent = `rendering ${secs}s, seed ${seed}…`;
      const { wav, log } = await window.Engine.renderOffline(secs, seed, { energy: 1 }, p => { $('progress').firstElementChild.style.width = (p * 100) + '%'; });
      $('log').innerHTML = log.map(l => `<div>${l.t}s cue${l.cue} ${l.key} ${l.sec} ${l.chord} · ${l.layers}</div>`).join('');
      const name = params.get('name') || `seed${seed}-${secs}s`;
      const r = await fetch('/render', { method: 'POST', headers: { 'X-Name': name, 'Content-Type': 'application/octet-stream' }, body: wav });
      await fetch('/render', { method: 'POST', headers: { 'X-Name': name + '.log', 'Content-Type': 'application/json' }, body: JSON.stringify(log) });
      $('title').textContent = 'rendered: ' + await r.text(); window.__renderDone = true;
      return;
    }

    let seed = parseInt(params.get('seed') || String(Math.floor(Math.random() * 1e9)), 10);
    $('seed').value = seed;
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
    const engine = new window.Engine.Engine(ctx);
    await engine.load((p, inst) => { $('progress').firstElementChild.style.width = (p * 100) + '%'; $('status').textContent = `decoding ${inst.replace(/_/g, ' ')}`; });
    $('status').textContent = ''; $('progress').style.display = 'none';
    $('title').textContent = 'ready'; $('sub').textContent = 'press play';
    $('play').disabled = false; $('skip').disabled = false;

    let radio = window.Composer.createRadio(seed), player = null, playing = false, lastCue = 0;
    function onBar(bar) {
      $('title').textContent = `${bar.cue.keyName} · ${bar.cue.prog} · ${bar.tempo} bpm · ${bar.cue.flavor}`;
      $('sub').textContent = `${bar.section.name} ${bar.section.index + 1}/${bar.section.bars} · tune on ${bar.cue.melodyInst.replace(/_/g, ' ')}`;
      $('chord').textContent = bar.chord.name;
      for (const el of $('layers').children) el.classList.toggle('on', bar.layers.includes(el.dataset.l));
      if (bar.cue.id !== lastCue) { lastCue = bar.cue.id; const d = document.createElement('div'); d.textContent = `${new Date().toLocaleTimeString()}  ${bar.cue.title}`; $('log').prepend(d); }
    }
    function newPlayer() { player = new window.Engine.Player(engine, radio, onBar); }
    newPlayer();
    window.__ngr = { ctx, engine, get player() { return player; }, get radio() { return radio; } }; // for the dev loop

    // ---- mixer: one fader + mute per stem, remembered in localStorage ----
    const STEMS = [
      ['whistle', ['whistle']], ['bass', ['electric_bass_finger']], ['drums', ['kick', 'snare', 'hat', 'crash']], ['shaker', ['shaker']],
      ['triangle', ['triangle']], ['guitar', ['electric_guitar_muted']], ['wurly', ['electric_piano_1']], ['organ', ['rock_organ']],
      ['horns', ['french_horn']], ['strings', ['string_ensemble_1']], ['choir', ['choir_aahs']], ['harp', ['orchestral_harp']],
      ['clarinet', ['clarinet']], ['bassoon', ['bassoon']], ['tuba', ['tuba']], ['pizz strings', ['pizzicato_strings']],
      ['glock', ['glockenspiel']], ['muted trumpet', ['muted_trumpet']], ['reverb', ['reverb']],
    ];
    let mix = {};
    try { mix = JSON.parse(localStorage.getItem('ngr.mix') || '{}') || {}; } catch (e) { mix = {}; }
    function applyStem(name, strips) {
      const m = mix[name] || {}; const level = m.mute ? 0 : (m.level == null ? 1 : m.level);
      for (const st of strips) engine.setLevel(st, level);
    }
    function saveMix() { try { localStorage.setItem('ngr.mix', JSON.stringify(mix)); } catch (e) { } }
    function buildMixer() {
      $('mixer').innerHTML = '';
      for (const [name, strips] of STEMS) {
        const m = mix[name] || {};
        const row = document.createElement('div'); row.className = 'stem' + (m.mute ? ' off' : '');
        row.innerHTML = `<label title="${strips.join(', ')}">${name}</label><input type="range" min="0" max="1.5" step="0.01" value="${m.level == null ? 1 : m.level}"><button class="${m.mute ? 'muted' : ''}">${m.mute ? 'muted' : 'mute'}</button>`;
        const slider = row.querySelector('input'), btn = row.querySelector('button');
        slider.oninput = () => { mix[name] = Object.assign({}, mix[name], { level: parseFloat(slider.value) }); applyStem(name, strips); saveMix(); };
        slider.ondblclick = () => { slider.value = 1; slider.oninput(); };
        btn.onclick = () => { mix[name] = Object.assign({}, mix[name], { mute: !(mix[name] && mix[name].mute) }); btn.textContent = mix[name].mute ? 'muted' : 'mute'; btn.classList.toggle('muted', mix[name].mute); row.classList.toggle('off', mix[name].mute); applyStem(name, strips); saveMix(); };
        $('mixer').appendChild(row);
        applyStem(name, strips);
      }
    }
    buildMixer();
    $('mixreset').onclick = () => { mix = {}; saveMix(); buildMixer(); };
    $('play').onclick = async () => {
      if (!playing) { await ctx.resume(); player.start(); playing = true; $('play').innerHTML = '&#10074;&#10074;'; }
      else { player.stop(); playing = false; $('play').innerHTML = '&#9654;'; $('sub').textContent = 'paused'; }
    };
    $('skip').onclick = () => { if (playing) { player.stop(); radio.skipCue(); newPlayer(); setTimeout(() => player.start(), 320); } else radio.skipCue(); };
    $('vol').oninput = e => { engine.master.gain.setTargetAtTime(0.9 * parseFloat(e.target.value), ctx.currentTime, 0.02); };
    $('reseed').onclick = () => { seed = Math.floor(Math.random() * 1e9); $('seed').value = seed; radio = window.Composer.createRadio(seed); if (playing) { player.stop(); newPlayer(); setTimeout(() => player.start(), 320); } else newPlayer(); };
    $('seed').onchange = e => { seed = parseInt(e.target.value, 10) || 1; radio = window.Composer.createRadio(seed); if (playing) { player.stop(); newPlayer(); setTimeout(() => player.start(), 320); } else newPlayer(); };
    document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); $('play').click(); } });

    // visualizer
    const canvas = $('viz'), g2 = canvas.getContext('2d'), data = new Uint8Array(engine.analyser.frequencyBinCount);
    (function draw() {
      requestAnimationFrame(draw);
      engine.analyser.getByteFrequencyData(data);
      g2.clearRect(0, 0, canvas.width, canvas.height);
      const bars = 64, w = canvas.width / bars;
      for (let i = 0; i < bars; i++) {
        const idx = Math.floor(Math.pow(i / bars, 1.7) * data.length * 0.6);
        const h = (data[idx] / 255) * canvas.height;
        g2.fillStyle = `hsl(${36 + i * 0.4}, 85%, ${45 + 25 * (data[idx] / 255)}%)`;
        g2.fillRect(i * w + 1, canvas.height - h, w - 2, h);
      }
    })();
  })();
  </script>
</body>
</html>
